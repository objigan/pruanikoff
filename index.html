<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пряникофф — Формы для пряников</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
</head>
<body>
    <!-- Шапка сайта -->
    <header class="site-header">
        <div class="logo">Пряникофф</div>
        <button id="cart-btn" class="cart-button">
            🛒 Корзина (<span id="cart-count">0</span>)
        </button>
    </header>

    <div class="container">
        <!-- Блок О нас -->
        <section class="about-section">
            <h2>О компании «Пряникофф»</h2>
            <p>Мы производим качественные и удобные формочки для пряников. Здесь будет ваш текст о том, кто вы и чем занимаетесь. Текст можно будет поменять в любой момент.</p>
        </section>

        <!-- Поиск -->
        <div class="search-section">
            <h1>Поиск по каталогу</h1>
            <input type="search" id="search-input" placeholder="Введите название или артикул...">
        </div>
        
        <!-- Результаты поиска -->
        <div id="results-container" class="grid-container"></div>
        
        <!-- 12 случайных карточек -->
        <h2 class="section-title" id="random-title">Популярные формы</h2>
        <div id="random-container" class="grid-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
